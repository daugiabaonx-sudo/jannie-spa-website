; =============================================================================
; JN Project — PHP 8.3 Custom Configuration
; =============================================================================

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 3000

; Error handling — log outside the web root (/var/log/wordpress/debug.log)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/wordpress/debug.log

; WordPress core expects PHP default timezone to remain UTC
date.timezone = UTC

; OPcache settings
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
