# =============================================================================
# JN Step 7 & Step 8 — Nginx Equivalent Rules (Reference for Production Deployment)
# Mirrors wordpress/.htaccess & wordpress/media/.htaccess 1:1.
# =============================================================================

server_tokens off;
autoindex off;

# Brotli & Gzip compression (Step 8 Task 2)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/ld+json application/xml image/svg+xml;

# Uncomment when ngx_brotli module is compiled into Nginx:
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/ld+json application/xml image/svg+xml;

# Security headers
more_clear_headers 'X-Powered-By' 'X-Pingback' 'X-Redirect-By';
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; report-uri /api/jn/v1/csp-report" always;

# Long-lived immutable browser caching for hashed static assets, fonts, and images (Step 8 Task 2)
location ~* \.(?:css|js|mjs|woff2|woff|ttf|otf|avif|webp|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # A location-level add_header drops the server-level set: repeat the full policy here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; report-uri /api/jn/v1/csp-report" always;
    access_log off;
}

# 1. Deny default WordPress signature files & install/upgrade scripts with 404
location ~* ^/(?:xmlrpc\.php|wp-trackback\.php|readme\.html|license\.txt|wp-config-sample\.php|wp-config\.php|wp-activate\.php|wp-signup\.php|wp-links-opml\.php|wp-mail\.php)$ {
    return 404;
}

location ~* ^/wp-admin/(?:install|upgrade|setup-config|install-helper)\.php$ {
    return 404;
}

# 2. Deny legacy /wp-json/, core sitemaps (/wp-sitemap*.xml) and /wp-content/ with 404
location ~* ^/wp-json(?:/.*)?$ {
    return 404;
}

location ~* ^/wp-sitemap.*\.(?:xml|xsl)$ {
    return 404;
}

location ~* ^/wp-content(?:/.*)?$ {
    return 404;
}

location ~* ^/(?:app|media|wp-includes)/?$ {
    return 404;
}

# 3. Never execute PHP inside /media/
location ~* ^/media/.*\.(?:php[0-9]?|phtml|phar|inc|pl|py|cgi|sh|asp|aspx|jsp|shtml)$ {
    return 404;
}

# 4. Protect dotfiles, logs, SQL dumps and backups
location ~* (?:/|^)\.(?:env|git|htaccess|htpasswd|DS_Store) {
    return 404;
}

location ~* \.(?:log|sql|gz|bak|swp|ini|sh)$ {
    return 404;
}

# 5. Neutral Asset URL Aliases (Task E)
rewrite ^/api/ajax$ /wp-admin/admin-ajax.php last;
rewrite ^/static/core/(.*)$ /wp-includes/$1 break;
rewrite ^/static/core-admin/(css|js|images)/(.*)$ /wp-admin/$1/$2 break;
rewrite ^/static/base/(.*)$ /app/themes/blocksy/$1 break;
rewrite ^/static/ui/(.*)$ /app/themes/jannie/$1 break;
rewrite ^/static/shop/(.*)$ /app/modules/woocommerce/$1 break;
rewrite ^/static/academy/(.*)$ /app/modules/jn-core/$1 break;
rewrite ^/static/ext/(.*)$ /app/modules/$1 break;
