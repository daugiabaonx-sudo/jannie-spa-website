# =============================================================================
# JN Step 9 — Production Nginx Server Configuration (`deploy/nginx-production.conf`)
# Target path on host: `/etc/nginx/sites-available/PROD_DOMAIN.conf`
# Replace `PROD_DOMAIN` with the canonical production domain (e.g. jannienguyen.vn)
# =============================================================================

# 1. Force HTTP -> Canonical HTTPS (301 Permanent)
server {
    listen 80;
    listen [::]:80;
    server_name PROD_DOMAIN www.PROD_DOMAIN;
    server_tokens off;
    return 301 https://PROD_DOMAIN$request_uri;
}

# 2. Force www -> Canonical Non-WWW HTTPS (301 Permanent)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.PROD_DOMAIN;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/PROD_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PROD_DOMAIN/privkey.pem;

    return 301 https://PROD_DOMAIN$request_uri;
}

# 3. Canonical HTTPS Server Block (`https://PROD_DOMAIN`)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name PROD_DOMAIN;

    root /var/www/PROD_DOMAIN/wordpress;
    index index.php;

    server_tokens off;
    autoindex off;
    client_max_body_size 64M;

    # TLS 1.2 / 1.3 Configuration
    ssl_certificate     /etc/letsencrypt/live/PROD_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PROD_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Compression (Gzip + Brotli when ngx_brotli is loaded)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/ld+json application/xml image/svg+xml;

    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/ld+json application/xml image/svg+xml;

    # Strip platform headers & set Production Security Headers
    fastcgi_hide_header X-Powered-By;
    fastcgi_hide_header X-Pingback;
    fastcgi_hide_header X-Redirect-By;
    # PHP also sends the security headers as a fallback (JN_Hardening_HTML_Headers); hide them so the
    # snippet below is the single source and no header is duplicated.
    fastcgi_hide_header Strict-Transport-Security;
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Permissions-Policy;
    fastcgi_hide_header Content-Security-Policy-Report-Only;

    # Shared header set (deploy/nginx-security-headers.conf -> /etc/nginx/snippets/jn-security-headers.conf).
    include /etc/nginx/snippets/jn-security-headers.conf;

    # Step 7 Neutral Asset URL Aliases (ADR-010)
    rewrite ^/api/ajax$ /wp-admin/admin-ajax.php last;
    rewrite ^/static/core/(.*)$ /wp-includes/$1 break;
    rewrite ^/static/core-admin/(css|js|images)/(.*)$ /wp-admin/$1/$2 break;
    rewrite ^/static/base/(.*)$ /app/themes/blocksy/$1 break;
    rewrite ^/static/ui/(.*)$ /app/themes/jannie/$1 break;
    rewrite ^/static/shop/(.*)$ /app/modules/woocommerce/$1 break;
    rewrite ^/static/academy/(.*)$ /app/modules/jn-core/$1 break;
    rewrite ^/static/ext/(.*)$ /app/modules/$1 break;

    # Step 7 Deny Rules — Return 404 Not Found
    location ~* ^/(?:xmlrpc\.php|wp-trackback\.php|readme\.html|license\.txt|wp-config-sample\.php|wp-config\.php|wp-activate\.php|wp-signup\.php|wp-links-opml\.php|wp-mail\.php|wp-cron\.php)$ {
        return 404;
    }

    location ~* ^/wp-admin/(?:install|upgrade|setup-config|install-helper)\.php$ {
        return 404;
    }

    location ~* ^/wp-json(?:/.*)?$ {
        return 404;
    }

    location ~* ^/wp-sitemap.*\.(?:xml|xsl)$ {
        return 404;
    }

    location ~* ^/wp-content(?:/.*)?$ {
        return 404;
    }

    location ~* ^/(?:app|media|wp-includes)/?$ {
        return 404;
    }

    location ~* ^/media/.*\.(?:php[0-9]?|phtml|phar|inc|pl|py|cgi|sh|asp|aspx|jsp|shtml)$ {
        return 404;
    }

    # Legacy booking .ics attachments (now written to the system temp dir): never serve if any reappear.
    location ^~ /media/jn-ics-tmp/ {
        return 404;
    }

    location ~* (?:/|^)\.(?:env|git|htaccess|htpasswd|DS_Store) {
        return 404;
    }

    location ~* \.(?:log|sql|gz|bak|swp|ini|sh)$ {
        return 404;
    }

    # Long-lived immutable browser caching for static assets, fonts, and images
    location ~* \.(?:css|js|mjs|woff2|woff|ttf|otf|avif|webp|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # A location-level add_header drops the server-level set, so re-include it here.
        include /etc/nginx/snippets/jn-security-headers.conf;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
