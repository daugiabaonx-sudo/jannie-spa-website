# =============================================================================
# JN — Shared security headers (`deploy/nginx-security-headers.conf`)
# Install at: `/etc/nginx/snippets/jn-security-headers.conf`
#
# nginx `add_header` is NOT inherited by a `location` that declares its own `add_header`
# (for example the static-asset cache block). Include this snippet at server level AND in
# every location that adds headers, so all responses carry the same policy as Apache.
# =============================================================================
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; report-uri /api/jn/v1/csp-report" always;
